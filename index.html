<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ted's Tab</title>
<meta name="description" content="Track and settle group travel costs.">
<meta name="theme-color" content="#13294b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ted's Tab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single column, boarding-pass header, ticket-stub cards, bottom tab bar. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#e4eaef; --fg:#14243a; --muted:#5a6a7d; --line:#d3dbe3;
  --good:#1d8456; --bad:#c23d2b; --warn:#a8711a;
  --accent:#f26b21; --accent-ink:#ffffff; --accent-soft:#fde4d5;
  --hero-a:#13294b; --hero-b:#21507d; --hero-ink:#f4f1ea; --hero-muted:#b8c6d8;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141f; --surface:#142132; --surface-2:#1b2a3e; --fg:#e7edf4; --muted:#94a4b8; --line:#26374c;
  --good:#4cc38a; --bad:#ff7d69; --warn:#e7b55c; --accent-soft:#3a2516; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c141f; --surface:#142132; --surface-2:#1b2a3e; --fg:#e7edf4; --muted:#94a4b8; --line:#26374c;
  --good:#4cc38a; --bad:#ff7d69; --warn:#e7b55c; --accent-soft:#3a2516; color-scheme:dark}
/* Skins: trip-level looks. Hero colors carry their own ink so they read in either theme. */
[data-skin="riviera"]{--accent:#e8505b; --accent-soft:#fbdde0; --hero-a:#0a6c8f; --hero-b:#2bb3c0; --hero-ink:#fffbea; --hero-muted:#d4f1f4}
[data-skin="alpine"]{--accent:#d63a2f; --accent-soft:#f7dcd9; --hero-a:#1d3b2f; --hero-b:#3f6f55; --hero-ink:#f3f1e8; --hero-muted:#c7d8cc}
[data-skin="desert"]{--accent:#0f8b8d; --accent-soft:#d3eeee; --hero-a:#a4492a; --hero-b:#e0a35c; --hero-ink:#fff8ee; --hero-muted:#fbe3c6}
[data-skin="tokyo"]{--accent:#ff3ea5; --accent-soft:#3b1630; --hero-a:#120a2a; --hero-b:#3a1466; --hero-ink:#f5ecff; --hero-muted:#c3a8ff;
  --bg:#0b0816; --surface:#151027; --surface-2:#1f1838; --fg:#efe9ff; --muted:#a69cc4; --line:#2c2350; --good:#3df0b0; --bad:#ff6b8b; color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-skin]:not([data-skin="tokyo"]){--accent-soft:#3a2516}}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#app{min-height:100vh;background:var(--bg);color:var(--fg)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(96px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);letter-spacing:.04em}
.label{font:600 11px/1 var(--body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font:800 26px/1 var(--display);letter-spacing:.01em;text-transform:uppercase}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:12px}
.section{display:grid;gap:12px;margin-top:22px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;font-weight:600;background:var(--surface-2);color:var(--fg)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{min-height:34px;padding:0 13px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.45}
.link{color:var(--accent);font-weight:600}

/* Boarding-pass header */
.pass{position:relative;margin:12px 0 0;border-radius:20px;color:var(--hero-ink);background:linear-gradient(135deg,var(--hero-a),var(--hero-b));overflow:hidden}
.pass::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.035) 22px 23px);pointer-events:none}
.pass-main{padding:16px 18px 14px;display:grid;gap:10px;position:relative;z-index:1}
.route{display:flex;align-items:center;gap:10px;font:800 30px/1 var(--display);letter-spacing:.04em}
.route svg{flex:1;height:14px;opacity:.75}
.pass h1{font:800 34px/.95 var(--display);text-transform:uppercase;letter-spacing:.01em}
.pass-meta{display:flex;flex-wrap:wrap;gap:6px 18px}
.pass-meta div{display:grid;gap:3px}
.pass-meta .k{font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted)}
.pass-meta .v{font:500 14px/1.1 var(--mono)}
.perf{position:relative;height:0;border-top:2px dashed rgba(255,255,255,.28);margin:0 18px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf::before{left:-29px}.perf::after{right:-29px}
.pass-stub{padding:12px 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.pass-stub .big{font:800 30px/1 var(--display)}
.top-actions{display:flex;justify-content:space-between;align-items:center;padding-top:calc(10px + var(--safe-t))}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.exp{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.exp .cat{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.exp .cat svg{width:22px;height:22px}
.exp .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .amt{text-align:right;font:600 16px/1.1 var(--mono)}
.exp .amt small{display:block;font:500 11px var(--body);color:var(--muted);margin-top:3px}
.day-head{display:flex;justify-content:space-between;margin:16px 2px 2px}
.chip-flag{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:4px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.chip-flag.hot{background:var(--accent);color:var(--accent-ink)}
.nudge{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--fg)}

/* Chips (people pickers) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.off{opacity:.5;text-decoration:line-through}
.chip .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 10px var(--body);color:#fff}

/* Forms */
.field{display:grid;gap:6px}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
textarea.input{min-height:110px;resize:vertical}
.input:focus{border-color:var(--accent);outline:none}
.amount-in{font:800 44px/1 var(--display);border:0;background:transparent;width:100%;padding:4px 0;color:var(--fg)}
.amount-row{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amount-row select{border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font:500 14px var(--mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*,.row>*,.toggle>*,.field>*{min-width:0}
.sheet{overflow-x:hidden}
/* iPhone Safari zooms into any text box under 16px; keep them at 16 so screens never end up wider than the phone */
input,select,textarea,.input{font-size:16px}
.hint{font-size:12.5px;color:var(--muted)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface-2);position:relative;border:1.5px solid var(--line);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--surface-2);font-weight:700}
.line-item{display:grid;grid-template-columns:1fr 90px;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.line-item .chips{grid-column:1/-1}
.line-item .chip{min-height:30px;padding:0 10px;font-size:13px}
.warn-box{padding:12px 14px;border-radius:12px;border:1.5px solid var(--warn);color:var(--fg);display:grid;gap:10px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:62px}
.nav button{display:grid;justify-items:center;gap:2px;font:600 11px var(--body);color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{width:58px!important;height:58px;border-radius:50%;background:var(--accent)!important;color:var(--accent-ink)!important;margin:-26px auto 0;box-shadow:0 6px 18px rgba(0,0,0,.25);display:grid!important;place-items:center}
.fab svg{width:28px!important;height:28px!important}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(24px + var(--safe-b));animation:up .22s ease-out}
.sheet-grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:sticky;top:-10px;background:var(--bg);padding:8px 0;z-index:2}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}*{transition:none!important}}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add-tile{display:grid;gap:8px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left}
.add-tile svg{width:28px;height:28px;color:var(--accent)}
.add-tile b{font-size:15px}
.add-tile span{font-size:12.5px;color:var(--muted)}

/* Settle tickets */
.ticket{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.ticket .ft{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.ticket .ft svg{width:18px;height:18px;color:var(--muted)}
.ticket .a{font:800 26px/1 var(--display);text-align:right}
.ticket .pay{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.bal-row{display:grid;grid-template-columns:minmax(80px,120px) 1fr 86px;gap:10px;align-items:center;font-size:14px}
.bal-track{position:relative;height:16px}
.bal-track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.bal-bar{position:absolute;top:2px;height:12px;border-radius:3px}

/* Charts */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(70px,110px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar-pair{display:grid;gap:3px}
.bar{height:10px;border-radius:3px;background:var(--accent);min-width:2px}
.bar.share{background:transparent;border:1.5px solid var(--muted);height:8px}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:16px;overflow-x:auto}
.col{flex:1 0 28px;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);align-self:stretch;grid-template-rows:auto 1fr auto}
.col .c{width:100%;background:var(--accent);border-radius:4px 4px 0 0;align-self:end;min-height:2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.tile .v{font:800 28px/1 var(--display)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:middle}
.legend i.o{background:transparent;border:1.5px solid var(--muted)}

/* Trip list */
.trip-card{display:block;width:100%;text-align:left;border-radius:18px;color:var(--hero-ink);background:linear-gradient(135deg,var(--hero-a),var(--hero-b));padding:16px 18px;position:relative;overflow:hidden}
.trip-card .route{font-size:22px}
.trip-card h3{font:800 28px/1 var(--display);text-transform:uppercase;margin-top:6px}
.trip-card .m{display:flex;gap:16px;margin-top:10px;font:500 13px var(--mono);color:var(--hero-muted)}
.brand{font:800 40px/.9 var(--display);text-transform:uppercase;letter-spacing:.01em;margin-top:18px}
.brand span{color:var(--accent)}

/* Overlays */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.stamp-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
.stamp{border:5px solid var(--accent);color:var(--accent);background:var(--bg);padding:14px 22px;border-radius:12px;transform:rotate(-8deg);text-align:center;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.stamp b{display:block;font:800 52px/.9 var(--display);text-transform:uppercase}
.stamp span{font:600 15px var(--body);color:var(--fg)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.receipt-img{width:100%;border-radius:12px;border:1px solid var(--line)}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.inbox-card{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1.5px dashed var(--accent);display:grid;gap:10px}
.qr{background:#fff;padding:12px;border-radius:12px;width:220px;margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
.empty{text-align:center;padding:30px 10px;display:grid;gap:10px;justify-items:center}
.empty svg{width:56px;height:56px;color:var(--muted)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--body);color:#fff;flex:none}
.split-sum{font-size:13px;color:var(--muted)}
.hidden{display:none!important}
.gauge{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.gauge span{display:block;height:100%;background:var(--accent);border-radius:99px}
.kitty{display:grid;gap:10px;border-width:1.5px}
.kitty.low{border-color:var(--bad)}
.badge{display:inline-block;font:700 10.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.wrapped-btn{display:grid;gap:4px;text-align:left;width:100%;padding:18px;border-radius:18px;color:var(--hero-ink);background:linear-gradient(120deg,var(--hero-a),var(--hero-b) 70%,var(--accent))}
.wrapped-btn b{font:800 32px/1 var(--display);text-transform:uppercase}
.wrapped-btn span:last-child{font-size:13px;color:var(--hero-muted)}
.dice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;margin-top:4px}
.die-cell{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);transition:transform .15s,border-color .15s}
.die-cell b{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.die-cell.rolling svg{animation:tumble .18s linear infinite}
.die-cell.loser{border-color:var(--accent);transform:scale(1.06);background:var(--accent-soft)}
.die-cell svg{width:58px;height:58px}
@keyframes tumble{0%{transform:rotate(0)}50%{transform:rotate(14deg) scale(.94)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.die-cell.rolling svg{animation:none}}
.wheel-box{position:relative;width:min(320px,82vw);margin:4px auto 0}
.wheel-box canvas{width:100%;height:auto;display:block}
.wheel-ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--fg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.wr-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.wr-track::-webkit-scrollbar{display:none}
.wr-card{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;max-height:62vh;border-radius:22px;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);padding:26px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.wr-card::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:28px solid var(--accent);opacity:.35}
.wr-k{font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted)}
.wr-big{font:800 clamp(40px,13vw,64px)/.92 var(--display);text-transform:uppercase;text-wrap:balance;overflow-wrap:break-word}
.wr-sub{font-size:17px;line-height:1.35;max-width:30ch;position:relative;z-index:1}
.wr-list{display:grid;gap:10px;position:relative;z-index:1}
.wr-list div{display:flex;justify-content:space-between;gap:10px;font-size:15px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:8px}
.wr-list b{font:800 20px/1 var(--display);text-transform:uppercase}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.hh-chip{border-style:dashed}

const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
async function cloudStore() {
  const [{ initializeApp }, A, F] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-auth.js"), import(FB + "firebase-firestore.js")]);

  catch { db = F.getFirestore(app); }

    const un = A.onAuthStateChanged(auth, u => { if (u) { un(); res(u.uid); } });
    A.signInAnonymously(auth).catch(rej);
  });
  const isCol = p => p.split("/").length % 2 === 1;

    mode: "cloud", uid,
    sub(path, cb, onErr) {
      if (isCol(path)) return F.onSnapshot(F.collection(db, path), { includeMetadataChanges: false }, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), s.docChanges().map(c => ({ type: c.type, id: c.doc.id, data: c.doc.data(), local: c.doc.metadata.hasPendingWrites }))), onErr);
      return F.onSnapshot(F.doc(db, path), d => cb(d.exists() ? { id: d.id, ...d.data() } : null), onErr);
    },
    async get(path) { const d = await F.getDoc(F.doc(db, path)); return d.exists() ? { id: d.id, ...d.data() } : null; },
    set: (path, data) => F.setDoc(F.doc(db, path), data),
    update: (path, data) => F.updateDoc(F.doc(db, path), data),
    del: path => F.deleteDoc(F.doc(db, path)),
    async batch(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const b = F.writeBatch(db);
        ops.slice(i, i + 400).forEach(o => o.op === "del" ? b.delete(F.doc(db, o.path)) : b.set(F.doc(db, o.path), o.data));
        await b.commit();
      }
    }
  };
}
function localStore() {
  let data = LS.get("localdb", {});
  const subs = new Set();
  const save = () => { LS.set("localdb", data); for (const s of subs) s.fire(); };
  const parent = p => p.split("/").slice(0, -1).join("/");
  return {
    mode: "local", uid: LS.get("localuid", null) || (() => { const u = "local-" + rid(8); LS.set("localuid", u); return u; })(),
    sub(path, cb) {
      const col = path.split("/").length % 2 === 1;
      let prev = {};
      const s = { fire() {
        if (col) {
          const docs = Object.keys(data).filter(k => parent(k) === path).map(k => ({ id: k.split("/").pop(), ...data[k] }));
          const changes = docs.filter(d => !(d.id in prev)).map(d => ({ type: "added", id: d.id, data: d, local: true }));
          prev = Object.fromEntries(docs.map(d => [d.id, 1]));
          cb(docs, changes);
        } else cb(data[path] ? { id: path.split("/").pop(), ...data[path] } : null);
      } };
      subs.add(s); setTimeout(() => s.fire());
      return () => subs.delete(s);
    },
    async get(path) { return data[path] ? { id: path.split("/").pop(), ...structuredClone(data[path]) } : null; },
    async set(path, d) { data[path] = structuredClone(d); save(); },
    async update(path, d) {
      if (!data[path]) throw new Error("missing");
      for (const [k, v] of Object.entries(d)) {
        if (k.includes(".")) { const [a, b] = k.split("."); data[path][a] = { ...(data[path][a] || {}), [b]: v }; }
        else data[path][k] = v;
      }
      save();
    },
    async del(path) { delete data[path]; save(); },
    async batch(ops) { ops.forEach(o => o.op === "del" ? delete data[o.path] : (data[o.path] = structuredClone(o.data))); save(); }
  };
}

/* ===================== Money math ===================== */
function tripCur() { return S.trip?.currency || "USD"; }
function rateOf(e) { return e.currency && e.currency !== tripCur() ? (+e.rate || 0) : 1; }

function expTotal(e) { return sign(e) * (+e.amount || 0) * rateOf(e); }
function payerMap(e) { // trip-currency amounts per payer
  const r = rateOf(e) * sign(e), out = {};
  if (e.payers && Object.keys(e.payers).length) for (const [p, a] of Object.entries(e.payers)) out[p] = (+a || 0) * r;
  else if (e.paidBy) out[e.paidBy] = expTotal(e);
  return out;
}
function shareMap(e) {
  const total = expTotal(e), split = e.split || {}, out = {};
  const parts = Object.keys(split).filter(k => +split[k] > 0);
  if (e.mode === "items" && e.items?.length) {
    const base = {};
    for (const it of e.items) {
      const ps = it.pids?.length ? it.pids : parts; if (!ps.length) continue;
      for (const p of ps) base[p] = (base[p] || 0) + (+it.amount || 0) / ps.length;
    }
    const bt = Object.values(base).reduce((a, b) => a + b, 0);
    for (const p in base) out[p] = bt ? total * base[p] / bt : 0;
    return out;
  }
  const W = parts.reduce((s, p) => s + +split[p], 0);
  for (const p of parts) out[p] = W ? total * +split[p] / W : 0;
  return out;
}
function computeBalances(people, expenses, payments) {
  const b = {}; for (const p of people) b[p.id] = { paid: 0, share: 0, sent: 0, recv: 0, net: 0 };
  const g = id => (b[id] ||= { paid: 0, share: 0, sent: 0, recv: 0, net: 0 });
  for (const e of expenses) {
    for (const [p, a] of Object.entries(payerMap(e))) g(p).paid += a;
    for (const [p, a] of Object.entries(shareMap(e))) g(p).share += a;
  }
  for (const pm of payments) { g(pm.from).sent += +pm.amount || 0; g(pm.to).recv += +pm.amount || 0; }
  for (const k in b) b[k].net = b[k].paid - b[k].share + b[k].sent - b[k].recv;
  return b;
}
function settlePlan(bal, mode, hub) {
  const cents = Object.entries(bal).map(([p, v]) => [p, Math.round(v.net * 100)]).filter(([, c]) => c !== 0);
  const out = [];
  if (mode === "hub" && hub && bal[hub]) {
    for (const [p, c] of cents) { if (p === hub) continue; if (c < 0) out.push({ from: p, to: hub, amount: -c / 100 }); else out.push({ from: hub, to: p, amount: c / 100 }); }
    return out;
  }
  const cr = cents.filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).map(x => [...x]);
  const dr = cents.filter(x => x[1] < 0).map(([p, c]) => [p, -c]).sort((a, b) => b[1] - a[1]);
  let i = 0, j = 0;
  while (i < dr.length && j < cr.length) {
    const x = Math.min(dr[i][1], cr[j][1]);
    if (x > 0) out.push({ from: dr[i][0], to: cr[j][0], amount: x / 100 });
    dr[i][1] -= x; cr[j][1] -= x;
    if (!dr[i][1]) i++; if (!cr[j][1]) j++;

}

function blip(f, t0, dur, type = "sine", vol = .15, f2) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;

  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
}

function nameOf(id) { const p = personById(id); return p.nickname && !p.kitty ? `${p.nickname} (${firstName(p.name)})` : p.name; }

function unitsMap() {
  const m = {};
  for (const p of S.people) { const k = unitKey(p.id); (m[k] ||= { key: k, label: p.household?.trim() || dn(p), members: [], lead: p.id }).members.push(p.id); }

/* ===================== Claude (via Cloudflare relay) ===================== */
const claudeReady = () => !!CFG.claudeProxy;
async function askClaude(system, content, max_tokens = 2500) {
  if (!claudeReady()) throw new Error("Receipt reading is not set up yet. Add the Claude relay URL in config.js.");
  const r = await fetch(CFG.claudeProxy, { method: "POST", headers: { "content-type": "application/json", "x-app-key": CFG.appKey || "" }, body: JSON.stringify({ system, max_tokens, messages: [{ role: "user", content }] }) });
  const txt = await r.text();
  if (!r.ok) throw new Error(r.status === 403 ? "The Claude relay refused the request. Check the app key." : "Claude could not read that (" + r.status + "). Try again.");
  const j = JSON.parse(txt);
  const t = (j.content || []).filter(b => b.type === "text").map(b => b.text).join("");
  return parseJSONLoose(t);
}
function parseJSONLoose(t) {
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) try { return JSON.parse(f[1]); } catch {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error("Claude's answer was not readable. Try again.");
}
async function fileToJpeg(file, max = 1568, q = .85) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { URL.revokeObjectURL(url); }
}
async function thumbFor(file) { // stored copy, kept small for the database
  let d = await fileToJpeg(file, 1000, .6);
  if (d.length > 300000) d = await fileToJpeg(file, 760, .5);
  return d;
}
function rosterText() { return S.people.map(p => p.name + (p.nickname ? ` (aka ${p.nickname})` : "") + (p.household ? ` [household: ${p.household}]` : "")).join(", ") || "(none yet)"; }
async function readReceipt(file) {
  const big = await fileToJpeg(file);
  const sys = "You read photos of receipts for a group travel expense app. Reply with only one JSON object, no prose.";
  const prompt = `Read this receipt. It may be a paper receipt, a card slip, or a screenshot of an app or email receipt (Uber, Lyft, Bolt, DoorDash, Uber Eats, Airbnb, booking sites). For app screenshots use the final charged total including fees and tip, and use the trip or order date shown. The trip currency is ${tripCur()}. Trip dates: ${S.trip.start || "?"} to ${S.trip.end || "?"}.
Return JSON:
{"is_receipt":true,"merchant":"","description":"short label like 'Dinner at Merchant' or 'Uber to airport'","date":"YYYY-MM-DD or null","currency":"ISO 4217 code","total":0,"subtotal":null,"tax":null,"tip":null,"category":"one of ${CATS.join("|")}","items":[{"name":"","amount":0}],"payment_note":"card brand / cash if shown, else null","card_last4":"last 4 digits of the card used if printed (e.g. from ****4821), else null"}
Rules: total is the final amount charged, including tax, service and any handwritten tip. Items are line items with their extended price (quantity times unit price); leave items empty if unreadable; at most 40. Pick currency from symbols, language and address. If this is not a receipt, set is_receipt false.`;
  const out = await askClaude(sys, [{ type: "image", source: { type: "base64", media_type: "image/jpeg", data: big.split(",")[1] } }, { type: "text", text: prompt }], 3000);
  return out;
}
async function readText(text) {
  const me = myPid() ? nameOf(myPid()) : null;
  const sys = "You turn casual notes about shared travel spending into structured expenses. Reply with only one JSON object, no prose.";
  const prompt = `Crew on this trip: ${rosterText()}.
The person typing is: ${me || "unknown"} (map "me", "I", "my" to them).
Trip currency: ${tripCur()}. Today is ${todayISO()}. Trip dates ${S.trip.start || "?"} to ${S.trip.end || "?"}.
Text (may be a pasted email, text message, or dictated note; may hold several expenses):
"""${text.slice(0, 12000)}"""
Return JSON:
{"expenses":[{"description":"short label","amount":0,"currency":"ISO code","date":"YYYY-MM-DD or null","category":"one of ${CATS.join("|")}",
"payers":[{"names":["name"],"amount":0}],
"participants":null,
"exclude":[],
"items":[]}]}
Rules: amount is the total. payers lists who put money in and how much; when several names share one amount (for example "130 from Amy and Scott"), put them together in one entry. If one person paid everything, one payers entry with the full amount. If no payer is stated, payers is an empty list. participants is a list of names who share the cost, or null when it is everyone. exclude lists names explicitly left out. Use names exactly as written when they are not in the crew list. Use crew spellings when they match.`;
  return askClaude(sys, prompt, 2500);
}
function matchPerson(name) {
  if (!name) return null;
  const n = String(name).trim().toLowerCase();
  if (["me", "i", "myself", "my"].includes(n)) return myPid();
  let p = S.people.find(p => p.name.toLowerCase() === n || (p.nickname || "").toLowerCase() === n)
       || S.people.find(p => dn(p).toLowerCase() === n)
       || S.people.find(p => dn(p).toLowerCase() === n.split(/\s+/)[0])
       || S.people.find(p => p.name.toLowerCase().startsWith(n));
  return p ? p.id : null;
}

/* ===================== Boot ===================== */
async function boot() {
  renderShell("Loading");
  try { S.store = CFG.firebase?.apiKey ? await cloudStore() : localStore(); }
  catch (e) { console.error(e); S.store = localStore(); toast("Could not reach the sync service. Working on this phone only for now.", 5000); }
  S.uid = S.store.uid; S.ready = true;
  for (const id of S.tripIds) watchTrip(id);
  const q = new URLSearchParams(location.search);
  const join = q.get("join") || q.get("trip");
  const shared = q.get("text") || q.get("title");
  history.replaceState(null, "", location.pathname);
  if (join) await joinTrip(join.toUpperCase());
  else if (S.tripIds.length && LS.get("lastTrip") && S.tripIds.includes(LS.get("lastTrip"))) openTrip(LS.get("lastTrip"));
  else render();
  if (shared && S.tripId) openQuickText([q.get("title"), q.get("text"), q.get("url")].filter(Boolean).join("\n"));
}
function watchTrip(id) {
  if (S.unsubTrips[id]) return;
  S.unsubTrips[id] = S.store.sub("trips/" + id, t => {
    if (t) S.trips[id] = t; else { delete S.trips[id]; }
    if (id === S.tripId) { S.trip = t; if (!t) { goHome(); toast("That trip was deleted."); return; } }
    render();
  }, e => console.warn(e));
}
function openTrip(id) {
  S.unsubTrip.forEach(u => u()); S.unsubTrip = [];
  S.tripId = id; S.trip = S.trips[id] || null; S.view = "trip"; S.people = []; S.expenses = []; S.payments = []; S.loaded = { expenses: false };
  LS.set("lastTrip", id);
  const base = "trips/" + id;
  S.unsubTrip.push(S.store.sub(base + "/people", docs => { S.people = docs.sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); render(); }));
  S.unsubTrip.push(S.store.sub(base + "/expenses", (docs, changes) => {
    const first = !S.loaded.expenses; S.expenses = docs; S.loaded.expenses = true;
    if (!first) for (const c of changes) if (c.type === "added" && !c.local && c.data.createdBy !== S.uid) {
      sfx("ping"); toast(`${short(Object.keys(payerMap(c.data))[0])} added ${c.data.description || "an expense"}, ${fmt(expTotal(c.data), tripCur())}`);
    }
    render();
  }));
  S.unsubTrip.push(S.store.sub(base + "/payments", docs => { S.payments = docs; render(); }));
  render();
}
function goHome() { S.unsubTrip.forEach(u => u()); S.unsubTrip = []; S.tripId = null; S.trip = null; S.view = "home"; LS.set("lastTrip", null); render(); }
async function joinTrip(code) {
  code = code.replace(/[^A-Z0-9]/gi, "").toUpperCase();
  if (!code) return;
  const t = await S.store.get("trips/" + code).catch(() => null);
  if (!t) { render(); toast("No trip found for code " + code + ". Check the code with the organizer."); return; }
  if (!S.tripIds.includes(code)) { S.tripIds.push(code); LS.set("trips", S.tripIds); }
  watchTrip(code); S.trips[code] = t; openTrip(code); sfx("paid");
}

function tripDays(t) {
  if (!t?.start || !t?.end) return [];
  const out = []; let d = new Date(t.start + "T12:00:00"); const e = new Date(t.end + "T12:00:00");
  while (d <= e && out.length < 60) { out.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); }
  return out;
}

function kittyStats(bal) { const b = bal[KITTY] || { paid: 0, recv: 0, sent: 0 }; const inn = b.recv, spent = b.paid, out = b.sent; return { inn, spent, out, left: inn - spent - out }; }

/* ---------- Exchange rates and dictation ---------- */
// Daily reference rates from free public services (no key). Cached per day on this phone.
async function fetchRate(from, to) {
  if (!from || !to || from === to) return 1;
  const key = `fx:${from}:${to}:${todayISO()}`;
  const hit = LS.get(key, null); if (hit) return hit;
  const sources = [
    async () => (await (await fetch(`https://api.frankfurter.dev/v1/latest?from=${from}&to=${to}`)).json()).rates?.[to],
    async () => (await (await fetch(`https://open.er-api.com/v6/latest/${from}`)).json()).rates?.[to]
  ];
  for (const src of sources) { try { const v = +(await src()); if (v > 0) { const x = +v.toFixed(4); LS.set(key, x); return x; } } catch {} }
  return null;
}
const rateMode = () => S.trip?.rateMode === "fixed" ? "fixed" : "daily";
// Haptics: Android uses vibrate. iPhone Safari has no vibrate, but toggling a hidden switch control gives a tap on recent iOS.
let hapEl;
function haptic(ms = 10) {
  if (S.settings.haptics === false) return;
  try { if (navigator.vibrate && navigator.vibrate(ms)) return; } catch {}
  try {
    if (!hapEl) { hapEl = document.createElement("label"); hapEl.setAttribute("aria-hidden", "true"); hapEl.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none"; hapEl.innerHTML = '<input type="checkbox" switch>'; document.body.append(hapEl); }
    hapEl.click();
  } catch {}
}
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function dictateInto(input, append) {
  if (!SpeechRec) { toast("Tap the microphone on your keyboard to talk instead."); input.focus(); return; }
  try {
    const rec = new SpeechRec(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = false;
    const base = append && input.value ? input.value + " " : "";
    rec.onresult = ev => { input.value = base + Array.from(ev.results).map(r => r[0].transcript).join(""); input.dispatchEvent(new Event("input")); };
    rec.onerror = () => toast("Could not hear that. Try the microphone on your keyboard.");
    rec.start(); toast("Listening");
  } catch { toast("Tap the microphone on your keyboard to talk instead."); input.focus(); }
}

      write(S.store.del(`trips/${S.tripId}/expenses/${d.id}`)); write(S.store.del(`trips/${S.tripId}/receipts/${d.id}`)); closeSheet(); closeSheet(); toast("Deleted");
    });
  }
  async function save() {
    readInputs();

    if (!(amount > 0)) return toast("Enter the amount.");
    if (d.currency !== cur && !(+d.rate > 0)) return toast(`Enter the ${d.currency} to ${cur} rate.`);
    const split = Object.fromEntries(Object.entries(d.split).filter(([, w]) => +w > 0).map(([k, w]) => [k, +w]));
    if (!Object.keys(split).length) return toast("Pick who shares this.");
    let payers = null, paidBy = d.paidBy;
    if (d.multi) {
      payers = Object.fromEntries(Object.entries(d.payers).map(([k, v]) => [k, round2(parseFloat(v) || 0)]).filter(([, v]) => v > 0));
      const s = Object.values(payers).reduce((a, b) => a + b, 0);
      if (Math.abs(s - amount) > .01) return toast(`Payer amounts add to ${fmt(s, d.currency)}, not ${fmt(amount, d.currency)}.`);
      paidBy = Object.keys(payers)[0];
      if (Object.keys(payers).length === 1) payers = null;
    }
    if (!paidBy) return toast("Pick who paid.");
    const rec = {
      description: d.description.trim() || d.category, amount, currency: d.currency, rate: d.currency === cur ? null : +d.rate,
      date: d.date || null, category: d.category, paidBy, payers, split, mode: d.items?.length && d.mode === "items" ? "items" : "even",

      hasReceipt: !!(d.hasReceipt || d._file || d._thumb), updatedAt: Date.now()

    if (!d.id && !dupWarned) {
      const dup = S.expenses.find(e => Math.abs(expTotal(e) - expTotal(rec)) < .01 && (!e.date || !rec.date || Math.abs(new Date(e.date) - new Date(rec.date)) <= 864e5));
      if (dup) {
        dupWarned = true;
        $("#dupBox", host).innerHTML = `<div class="warn-box"><span>Looks like a repeat: <b>${esc(short(dup.paidBy))}</b> already logged <b>${esc(dup.description)}</b> for ${fmt(expTotal(dup), cur)}${dup.date ? " on " + esc(shortDate(dup.date)) : ""}.</span><span class="muted" style="font-size:12.5px">Tap Save again to keep both.</span></div>`;
        $("#dupBox", host).scrollIntoView({ behavior: "smooth", block: "center" });
        return;
      }
    }
    const id = d.id || rid(12);
    if (!d.id) { rec.createdAt = Date.now(); rec.createdBy = S.uid; }
    else { rec.createdAt = d.createdAt || Date.now(); rec.createdBy = d.createdBy || S.uid; }
    write(S.store.set(`trips/${S.tripId}/expenses/${id}`, rec));
    if (d._file || (d._thumb && !d.id)) {
      const img = d._thumb && !d._file ? d._thumb : await thumbFor(d._file);
      write(S.store.set(`trips/${S.tripId}/receipts/${id}`, { img, at: Date.now() }), "The receipt photo did not upload. The expense itself saved.");
    }
    if (rec.rate && (rateMode() !== "fixed" || !S.trip.rates?.[rec.currency] || d.rateNote === "Rate you entered.")) write(S.store.update("trips/" + S.tripId, { ["rates." + rec.currency]: rec.rate }));
    if (opts.inboxId) S.inbox = S.inbox.filter(r => r.id !== opts.inboxId);
    closeSheet(); render();
    const tot = Math.abs(expTotal(rec));
    if (!d.id && !rec.refund && rec.paidBy !== KITTY && tot >= bigThreshold()) {
      const who = short(rec.paidBy);
      sfx("big"); stamp("Big spender", `${who} · ${fmt(tot, cur)}`);
      if (S.settings.tease) setTimeout(() => say(pick(BIG)(who, spokenMoney(tot, cur), rec.description)), 700);
    } else { sfx("add"); toast(d.id ? "Saved" : `Added ${fmt(expTotal(rec), cur)}`); }
  }
  draw(); ensureRate();
}

function guessCat(s) {
  s = String(s).toLowerCase();
  if (/\b(cab|taxi|uber|lyft|train|flight|car|bus|ferry|gas|fuel|parking|toll)\b/.test(s)) return "Transport";
  if (/hotel|room|airbnb|lodg|hostel|villa/.test(s)) return "Lodging";
  if (/dinner|lunch|breakfast|food|restaurant|cafe|pizza/.test(s)) return "Food";
  if (/bar|beer|wine|drink|pub/.test(s)) return "Drinks";
  if (/tip/.test(s)) return "Tips";
  if (/ticket|museum|tour|game|golf|palace|charter|show/.test(s)) return "Activities";
  if (/grocer|market|store/.test(s)) return "Groceries";
  if (/deposit/.test(s)) return "Deposit";
  return "Other";
}
// Matches a name as written in a sheet ("Jen gugni", "Jen", or "Big Ted (Ted)" from older exports) to a crew column.
function nameMatcher(names) {
  const full = names.map(n => n.trim().toLowerCase()), first = full.map(n => n.split(/\s+/)[0]);
  return raw => {
    const s = String(raw ?? "").trim(); if (!s) return -1;
    const m = s.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
    for (const t of m ? [s, m[2], m[1]] : [s]) {
      const x = t.trim().toLowerCase(); if (!x) continue;
      let i = full.indexOf(x); if (i >= 0) return i;
      i = first.indexOf(x); if (i >= 0 && first.lastIndexOf(x) === i) return i;
    }
    return -1;
  };
}
let foundEmpty = false;
function parseSheet(wb) {
  foundEmpty = false;
  const toISO = v => { if (v instanceof Date) { const x = new Date(+v + 6e4); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; } if (typeof v === "string" && /^\d{4}-\d\d-\d\d/.test(v)) return v.slice(0, 10); return null; };
  const num = v => typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/[^\d.\-]/g, ""));
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null });
    let hr = -1, pc = -1;
    for (let r = 0; r < Math.min(rows.length, 15) && hr < 0; r++) (rows[r] || []).forEach((v, c) => { if (hr < 0 && typeof v === "string" && /paid\s*by/i.test(v)) { hr = r; pc = c; } });
    if (hr < 0) continue;
    const H = rows[hr].map(v => typeof v === "string" ? v.toLowerCase().trim() : "");
    const find = re => H.findIndex(h => re.test(h));
    // Older sheets label both the description and the amount "Bill", so pick by what the column holds:
    // the amount is the candidate with the most numbers, the description the column left of it with the most text.
    const body = rows.slice(hr + 1, hr + 60);
    const count = (c, test) => body.filter(r => test((r || [])[c])).length;
    const isNum = v => typeof v === "number", isText = v => typeof v === "string" && v.trim() && isNaN(+v);
    let dt = find(/^date/);
    const amountCands = H.map((h, i) => /^bill$|^amount|^total|^cost|^price|amount|bill|cost/.test(h) && i < pc ? i : -1).filter(i => i >= 0);
    let ac = amountCands.sort((a, b) => count(b, isNum) - count(a, isNum))[0] ?? -1;
    if (ac < 0 || !count(ac, isNum)) ac = pc - 1;
    let dc = find(/desc|item|what/);
    if (dc < 0 || dc === ac) { dc = -1; let best = 0; for (let c = 0; c < pc; c++) if (c !== ac && c !== dt) { const n = count(c, isText); if (n > best) { best = n; dc = c; } } }
    if (dc < 0) dc = pc - 3;
    // This app's own export carries the original amount, currency and rate
    const oc = find(/^original amount/), cc = find(/^currency$/), rc = find(/^rate$/), kc = find(/^category$/);
    const curM = (H[ac] || "").match(/\(([a-z]{3})\)/), tripCurrency = curM ? curM[1].toUpperCase() : null;
    const names = [], cols = [];
    for (let c = pc + 1; c < (rows[hr].length || 0) + 1; c++) {
      const a = rows[hr][c], b = hr > 0 ? rows[hr - 1][c] : null;
      const n = typeof a === "string" && a.trim() && !/^(amount|rate|currency|category|id)/i.test(a) ? a : typeof b === "string" && b.trim() ? b : null;
      if (!n) break; names.push(n.trim()); cols.push(c);
    }
    if (!names.length) continue;
    const match = nameMatcher(names);
    // Nicknames and households: from the Balances tab when present, and from "Nick (First)" names in older exports
    const people = names.map(() => ({}));
    for (const s2 of wb.SheetNames) {
      const R = XLSX.utils.sheet_to_json(wb.Sheets[s2], { header: 1, raw: true, defval: null });
      const h2 = (R[0] || []).map(v => typeof v === "string" ? v.toLowerCase().trim() : "");
      const ni = h2.indexOf("nickname"), hi = h2.indexOf("household");
      if (h2[0] === "name" && (ni >= 0 || hi >= 0)) for (const row of R.slice(1)) { const i = match(row[0]); if (i >= 0) { if (ni >= 0 && row[ni]) people[i].nickname = String(row[ni]).trim(); if (hi >= 0 && row[hi]) people[i].household = String(row[hi]).trim(); } }
      for (const row of R) for (const v of row) if (typeof v === "string") { const m = v.match(/^(.*?)\s*\(([^()]+)\)$/); if (m && m[1].trim() && m[1].trim().toLowerCase() !== m[2].trim().toLowerCase()) { const i = match(m[2]); if (i >= 0 && !people[i].nickname) people[i].nickname = m[1].trim(); } }
    }
    const out = []; let skipped = 0;
    for (let r = hr + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const desc = row[dc], amt = num(row[ac]);
      if (typeof desc === "string" && /^total/i.test(desc.trim())) break;
      if (!desc && !amt) continue;
      if (!isFinite(amt) || !amt) continue;
      let weights = cols.map(c => { const v = row[c]; return typeof v === "number" ? Math.abs(v) : parseFloat(v) || 0; });
      const on = weights.filter(w => w > 0);
      if (on.length && Math.max(...on) - Math.min(...on) < .011) weights = weights.map(w => w > 0 ? 1 : 0); // equal shares become a plain even split
      let payers = null; const pb = row[pc];
      if (typeof pb === "string" && /\d/.test(pb) && /;/.test(pb)) payers = pb.split(";").map(s => s.trim().match(/^(.*?)\s+([\d.]+)$/)).filter(Boolean).map(m => [match(m[1]), +m[2]]);
      const payerIdx = payers ? (payers.every(p => p[0] >= 0) ? payers[0][0] : -1) : match(pb);
      if (payerIdx < 0) { skipped++; continue; }
      const orig = oc >= 0 ? num(row[oc]) : null, rcur = cc >= 0 && typeof row[cc] === "string" ? row[cc].trim().toUpperCase() : null, rate = rc >= 0 ? num(row[rc]) : null;
      out.push({ desc: String(desc || "Expense").trim(), amount: amt, payerIdx, payers, weights, date: toISO(dt >= 0 ? row[dt] : null), cat: kc >= 0 ? row[kc] : null,
        orig: isFinite(orig) && orig ? orig : null, cur: rcur, rate: isFinite(rate) && rate > 0 ? rate : null });
    }
    // Payments already made (this app's export has a Payments tab: Date, From, To, Amount)
    const payments = [];
    const ps = wb.SheetNames.find(n => /^payments$/i.test(n));
    if (ps) for (const row of XLSX.utils.sheet_to_json(wb.Sheets[ps], { header: 1, raw: true, defval: null }).slice(1)) {
      const from = match(row[1]), to = match(row[2]), a = num(row[3]);
      if (from >= 0 && to >= 0 && a > 0) payments.push({ from, to, amount: a, date: toISO(row[0]) });
    }
    if (out.length) return { names, rows: out, cur: tripCurrency, people, payments, skipped };
    foundEmpty = true;
  }
  return null;
}

    const bh = ["Name", "Paid", "Fair share", "Payments sent", "Payments received", "Net (+ owed to them)", "Nickname", "Household"];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([bh, ...[...ppl, ...(bal[KITTY] ? [personById(KITTY)] : [])].map(p => { const b = bal[p.id]; return [p.name, round2(b.paid), round2(b.share), round2(b.sent), round2(b.recv), round2(b.net), p.kitty ? "" : p.nickname || "", p.kitty ? "" : p.household || ""]; })]), "Balances");
    const plan = settlePlan(bal, S.trip.settleMode || "fewest", S.trip.hub);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["From", "To", `Amount (${cur})`, "Venmo", "Zelle", "PayPal"], ...plan.map(x => { const to = personById(x.to); return [nameOf(x.from), to.name, x.amount, to.venmo || "", to.zelle || "", to.paypal || ""]; })]), "Settle up");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Date", "From", "To", "Amount"], ...S.payments.map(p => [p.date, personById(p.from).name, personById(p.to).name, p.amount])]), "Payments");
    const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" });
    const name = (S.trip.name || "trip").replace(/[^\w\- ]+/g, "").trim() + ".xlsx";
    const file = new File([buf], name, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }).catch(() => {}); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  } catch (e) { console.error(e); toast("Export needs a connection the first time. Try again online."); }
}

/* ---------- Who's buying wheel ---------- */
function openWheel() {
  const bal = computeBalances(S.people, S.expenses, S.payments);
  const byHH = households().length > 0 && !!S.trip.byHousehold;
  const U = unitsMap();
  const units = byHH ? Object.values(U).filter(u => u.key !== KITTY) : S.people.map(p => ({ key: p.id, label: dn(p), members: [p.id], lead: p.id }));
  let mode = LS.get("wheelMode", "behind");
  let tool = LS.get("picker:" + S.tripId, S.trip.picker || "wheel");
  const sh = openSheet(`${sheetHead("Who's buying?")}
    <div class="stack">
      <div class="chips" style="justify-content:center"><button class="chip" data-tool="wheel">Wheel</button><button class="chip" data-tool="dice">Dice</button></div>
      <div class="chips" style="justify-content:center">
        <button class="chip" data-wm="behind">Who's behind</button><button class="chip" data-wm="luck">Pure luck</button><button class="chip" data-wm="rotation">Take turns</button>
      </div>
      <p class="muted" id="wHelp" style="margin:0;text-align:center;font-size:13px"></p>
      <div id="wheelView" class="stack"><div class="wheel-box"><div class="wheel-ptr"></div><canvas id="wc" width="640" height="640"></canvas></div>
      <p class="hint" style="text-align:center;margin:0">Grab the wheel and flick it, or tap Spin.</p>
      <button class="btn primary block" id="wSpin" style="min-height:54px;font-size:17px">Spin</button></div>
      <div id="diceView" class="stack hidden"><div class="dice-grid" id="dGrid"></div>
      <p class="hint" style="text-align:center;margin:0">Everyone rolls. Lowest roll buys.</p>
      <button class="btn primary block" id="dRoll" style="min-height:54px;font-size:17px">Roll</button></div>
      <button class="btn ghost block" id="dShake">Turn on shake</button>
      <div id="wRes"></div>
    </div>`, { skin: skinOf(S.trip) });
  const cv = $("#wc", sh), ctx = cv.getContext("2d");
  const css = getComputedStyle(sh);
  let rot = 0, segs = [], spinning = false;
  const unitNet = u => u.members.reduce((s, m) => s + (bal[m]?.net || 0), 0);
  const rounds = u => S.expenses.filter(e => e.category === "Drinks" && u.members.includes(e.paidBy)).length;
  function weights() {
    if (mode === "luck") return units.map(() => 1);
    if (mode === "rotation") { const r = units.map(rounds), m = Math.min(...r); return r.map(x => x === m ? 1 : 0.0001); }
    const nets = units.map(unitNet), scale = Math.max(1, ...nets.map(n => Math.abs(n)));
    return nets.map(n => 1 + Math.max(0, -n) / scale * 3);
  }
  function layout() {
    const w = weights(), tot = w.reduce((a, b) => a + b, 0); let a = 0;
    segs = units.map((u, i) => { const span = w[i] / tot * Math.PI * 2; const s = { u, start: a, end: a + span, color: personById(u.lead).color || PCOLORS[i % PCOLORS.length] }; a += span; return s; });
    $("#wHelp", sh).textContent = mode === "behind" ? "Better odds of buying for whoever owes the most." : mode === "luck" ? "Everyone has the same odds." : "Lands on whoever has bought the fewest drink rounds.";
    sh.querySelectorAll("[data-wm]").forEach(b => b.setAttribute("aria-pressed", b.dataset.wm === mode));
    draw();
  }
  function draw() {
    const R = 310, c = 320; ctx.clearRect(0, 0, 640, 640);
    ctx.save(); ctx.translate(c, c); ctx.rotate(rot);
    for (const s of segs) {
      if (s.end - s.start < .001) continue;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, s.start, s.end); ctx.closePath(); ctx.fillStyle = s.color; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 4; ctx.stroke();
      if (s.end - s.start > .12) { ctx.save(); ctx.rotate((s.start + s.end) / 2); ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
        ctx.font = `800 ${units.length > 8 ? 30 : 38}px "Big Shoulders Display", Impact, sans-serif`; ctx.fillText(String(s.u.label).toUpperCase().slice(0, 14), R - 22, 2); ctx.restore(); }
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(c, c, 46, 0, Math.PI * 2); ctx.fillStyle = css.getPropertyValue("--bg") || "#fff"; ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = css.getPropertyValue("--accent") || "#f26b21"; ctx.stroke();
  }
  const segAtPointer = () => { const a = ((-Math.PI / 2 - rot) % (Math.PI * 2) + Math.PI * 4) % (Math.PI * 2); return segs.find(s => a >= s.start && a < s.end); };
  sh.querySelectorAll("[data-wm]").forEach(b => b.onclick = () => { if (spinning) return; mode = b.dataset.wm; LS.set("wheelMode", mode); layout(); });
  // Spin: power 0..1 sets how many turns and how long; dir +1 clockwise, -1 counter-clockwise.
  // The winner is drawn from the mode's weights first, so how hard you flick never changes the odds.
  function spin(power = .6, dir = 1) {
    if (spinning || !segs.length) return; spinning = true; ac(); $("#wRes", sh).innerHTML = "";
    const w = weights(), tot = w.reduce((a, b) => a + b, 0); let r = Math.random() * tot, win = 0;
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) { win = i; break; } }
    const s = segs[win], target = s.start + (s.end - s.start) * (.2 + Math.random() * .6);
    const TAU = Math.PI * 2, want = -Math.PI / 2 - target, turns = 3 + Math.round(power * 6);
    const start = rot, mod = x => ((x % TAU) + TAU) % TAU;
    const final = dir > 0 ? start + TAU * turns + mod(want - start) : start - TAU * turns - mod(start - want);
    const t0 = performance.now(), dur = matchMedia("(prefers-reduced-motion: reduce)").matches ? 600 : 2800 + power * 3200;
    let last = null;
    const step = now => {
      const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4);
      rot = start + (final - start) * e; draw();
      const cur = segAtPointer(); if (cur !== last) { last = cur; if (S.settings.sound) blip(1900, 0, .03, "square", .05); haptic(8); }
      if (t < 1) requestAnimationFrame(step); else done(s.u);
    };
    requestAnimationFrame(step);
  }
  $("#wSpin", sh).onclick = () => spin(.6, 1);
  // Grab and flick: the wheel follows your finger, and letting go with speed spins it.
  cv.style.touchAction = "none"; cv.style.cursor = "grab";
  let drag = null;
  const angleAt = ev => { const b = cv.getBoundingClientRect(); return Math.atan2(ev.clientY - (b.top + b.height / 2), ev.clientX - (b.left + b.width / 2)); };
  cv.addEventListener("pointerdown", ev => { if (spinning) return; ac(); cv.setPointerCapture(ev.pointerId); drag = { a0: angleAt(ev), r0: rot, samples: [[performance.now(), rot]] }; cv.style.cursor = "grabbing"; });
  cv.addEventListener("pointermove", ev => {
    if (!drag) return;
    let da = angleAt(ev) - drag.a0; if (da > Math.PI) da -= Math.PI * 2; if (da < -Math.PI) da += Math.PI * 2;
    rot = drag.r0 + da; draw();
    const now = performance.now(); drag.samples.push([now, rot]); while (drag.samples.length > 2 && now - drag.samples[0][0] > 120) drag.samples.shift();
    if (Math.abs(da) > Math.PI * .9) { drag.a0 = angleAt(ev); drag.r0 = rot; } // allow winding more than half a turn
  });
  const release = () => {
    if (!drag) return; cv.style.cursor = "grab";
    const sm = drag.samples, [t1, r1] = sm[sm.length - 1], [t0, r0] = sm[0]; drag = null;
    const v = (r1 - r0) / Math.max(16, t1 - t0); // radians per ms
    if (Math.abs(v) < .003) { toast("Give it a harder flick, or tap Spin."); return; }
    spin(Math.min(1, Math.abs(v) / .03), v > 0 ? 1 : -1);
  };
  cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", release);
  function done(u) {
    spinning = false; sfx("big"); haptic(60); stamp(`Round's on ${u.label}`, tool === "dice" ? "The dice have spoken" : "Fate has spoken");
    if (S.settings.voice) setTimeout(() => say(pick([`This round is on ${u.label}!`, `Drinks are on ${u.label}.`, tool === "dice" ? `Snake eyes for ${u.label}. Pay up.` : `The wheel has chosen ${u.label}. No refunds.`])), 500);
    $("#wRes", sh).innerHTML = `<div class="two"><button class="btn ghost" id="wAgain">${tool === "dice" ? "Roll again" : "Spin again"}</button><button class="btn primary" id="wLog">Log the round</button></div>`;
    $("#wAgain", sh).onclick = () => tool === "dice" ? roll() : spin(.6, 1);
    $("#wLog", sh).onclick = () => { closeSheet(); const d = blankDraft(); d.paidBy = u.lead; d.category = "Drinks"; d.description = "Round"; openExpenseForm(d); };
  }
  /* ----- Dice: everyone rolls, lowest buys. The loser is drawn from the same mode weights as the wheel, then the dice are shown to match. ----- */
  const PIPS = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]], 5: [[27, 27], [73, 27], [50, 50], [27, 73], [73, 73]], 6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]] };
  const dieSvg = n => `<svg viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" rx="18" fill="#fff" stroke="currentColor" stroke-width="5"/>${PIPS[n].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="#14243a"/>`).join("")}</svg>`;
  const face = () => 1 + Math.floor(Math.random() * 6);
  function drawDice(vals) { $("#dGrid", sh).innerHTML = units.map((u, i) => `<div class="die-cell" data-di="${i}" style="color:${personById(u.lead).color || "#888"}">${dieSvg(vals ? vals[i] : 6)}<b>${esc(u.label)}</b></div>`).join(""); }
  function roll() {
    if (spinning || !units.length) return; spinning = true; ac(); $("#wRes", sh).innerHTML = "";
    const w = weights(), tot = w.reduce((a, b) => a + b, 0); let r = Math.random() * tot, win = 0;
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) { win = i; break; } }
    const low = 1 + Math.floor(Math.random() * 2); // loser rolls 1 or 2; everyone else rolls higher
    const final = units.map((_, i) => i === win ? low : low + 1 + Math.floor(Math.random() * (6 - low)));
    drawDice(units.map(face));
    const cells = [...sh.querySelectorAll("[data-di]")]; cells.forEach(c => c.classList.add("rolling"));
    const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const stopAt = units.map((_, i) => (fast ? 200 : 700) + i * (fast ? 40 : 220));
    const t0 = performance.now(); const stopped = new Set();
    const tick = setInterval(() => {
      const el = performance.now() - t0;
      cells.forEach((c, i) => {
        if (stopped.has(i)) return;
        if (el >= stopAt[i]) { stopped.add(i); c.classList.remove("rolling"); c.querySelector("svg").outerHTML = dieSvg(final[i]); haptic(12); if (S.settings.sound) blip(520 + final[i] * 90, 0, .07, "triangle", .08); }
        else { c.querySelector("svg").outerHTML = dieSvg(face()); if (Math.random() < .35 && S.settings.sound) blip(1500, 0, .02, "square", .03); }
      });
      if (stopped.size === units.length) { clearInterval(tick); setTimeout(() => { cells[win].classList.add("loser"); done(units[win]); }, 350); }
    }, 70);
  }
  $("#dRoll", sh).onclick = () => roll();
  // Shake the phone to spin the wheel or roll the dice again. iPhone asks permission once, after a tap (Apple's rule).
  let shakeOn = false, lastShake = 0;
  const onMotion = e => { const a = e.accelerationIncludingGravity || e.acceleration; if (!a) return; const m = Math.hypot(a.x || 0, a.y || 0, a.z || 0); if (m > 24 && Date.now() - lastShake > 2500 && !spinning) { lastShake = Date.now(); tool === "dice" ? roll() : spin(.8, 1); } };
  const shakeLabel = () => { $("#dShake", sh).textContent = shakeOn ? `Shake is on: shake to ${tool === "dice" ? "roll" : "spin"} again` : "Turn on shake"; };
  $("#dShake", sh).onclick = async () => {
    if (shakeOn) { removeEventListener("devicemotion", onMotion); shakeOn = false; shakeLabel(); return; }
    try { if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) { const p = await DeviceMotionEvent.requestPermission(); if (p !== "granted") { toast("Motion access was not allowed. Tap the button instead."); return; } } } catch { toast("Shake is not available here. Tap the button instead."); return; }
    addEventListener("devicemotion", onMotion); shakeOn = true; shakeLabel(); toast("Shake the phone to go again");
  };
  const stopShake = () => removeEventListener("devicemotion", onMotion);
  const obs = new MutationObserver(() => { if (!document.body.contains(sh)) { stopShake(); obs.disconnect(); } }); obs.observe(document.body, { childList: true, subtree: true });
  function setTool(t) {
    if (spinning) return; tool = t; LS.set("picker:" + S.tripId, t); $("#wRes", sh).innerHTML = "";
    $("#wheelView", sh).classList.toggle("hidden", t !== "wheel"); $("#diceView", sh).classList.toggle("hidden", t !== "dice");
    sh.querySelectorAll("[data-tool]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tool === t));
    if (t === "dice") drawDice();
    shakeLabel(); render();
  }
  sh.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
  layout(); setTool(tool);
}

/* ---------- Trip Wrapped ---------- */
function wrappedCards() {
  const cur = tripCur(), bal = computeBalances(S.people, S.expenses, S.payments), t = S.trip;
  const total = S.expenses.reduce((s, e) => s + expTotal(e), 0);
  const byDay = {}; for (const e of S.expenses) if (e.date) byDay[e.date] = (byDay[e.date] || 0) + expTotal(e);
  const dayList = Object.entries(byDay).sort((a, b) => b[1] - a[1]);
  const nDays = tripDays(t).length || dayList.length || 1;
  const cards = [];
  cards.push({ k: "Trip Wrapped", big: t.name, sub: `${nDays} day${nDays > 1 ? "s" : ""}. ${S.people.length} people. ${S.expenses.length} expenses.` });
  cards.push({ k: "All in", big: fmt(total, cur, { whole: true }), sub: `That's ${fmt(S.people.length ? total / S.people.length / nDays : 0, cur, { whole: true })} per person per day.` });
  const top = S.people.map(p => [p, bal[p.id]?.paid || 0]).sort((a, b) => b[1] - a[1])[0];
  if (top?.[1] > 0) cards.push({ k: "Big spender", big: dn(top[0]), sub: `Fronted ${fmt(top[1], cur, { whole: true })}. ${Math.round(top[1] / (total || 1) * 100)}% of the whole trip.` });
  if (dayList.length > 1) {
    const [d, v] = dayList[0]; const best = S.expenses.filter(e => e.date === d).sort((a, b) => expTotal(b) - expTotal(a))[0];
    cards.push({ k: "Biggest day", big: new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "long" }), sub: `${fmt(v, cur, { whole: true })} gone. Headliner: ${best?.description || "?"}.` });
  }
  const bigE = [...S.expenses].sort((a, b) => expTotal(b) - expTotal(a))[0];
  if (bigE) cards.push({ k: "Single biggest bill", big: fmt(expTotal(bigE), cur, { whole: true }), sub: `${bigE.description}, covered by ${Object.keys(payerMap(bigE)).map(short).join(" and ")}.` });
  const drinks = S.expenses.filter(e => e.category === "Drinks"), dT = drinks.reduce((s, e) => s + expTotal(e), 0);
  if (dT > 0) cards.push({ k: "The bar tab", big: fmt(dT, cur, { whole: true }), sub: `${drinks.length} round${drinks.length > 1 ? "s" : ""} on the books. Cheers.` });
  if (dayList.length > 2) { const [d, v] = dayList.at(-1); cards.push({ k: "Thriftiest day", big: new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "long" }), sub: `Only ${fmt(v, cur, { whole: true })}. Someone was paying attention.` }); }
  const badges = computeBadges(bal), list = [];
  for (const p of S.people) for (const b of badges[p.id] || []) if (b.title !== "Square Deal") list.push([b.title, dn(p)]);
  if (list.length) cards.push({ k: "Awards", list: list.slice(0, 7) });
  const plan = settlePlan(bal, t.settleMode || "fewest", t.hub || S.people[0]?.id);
  const worst = Object.entries(bal).filter(([k]) => k !== KITTY).sort((a, b) => a[1].net - b[1].net)[0];
  cards.push(plan.length ? { k: "Still on the tab", big: `${plan.length} payment${plan.length > 1 ? "s" : ""} left`, sub: worst && worst[1].net < -1 ? `${short(worst[0])}, this one's mostly about you. ${fmt(-worst[1].net, cur)}.` : "Open Settle up to close it out." } : { k: "The tab", big: "All square", sub: "Everybody's even. Same crew next year?" });

}
function openWrapped() {

  const sh = openSheet(`${sheetHead("Wrapped")}

      ${c.list ? `<div class="wr-list">${c.list.map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>` : `<div class="wr-big" style="${Math.max(...String(c.big).split(/\s+/).map(w => w.length)) > 8 ? "font-size:clamp(30px,9vw,46px)" : ""}">${esc(c.big)}</div>`}
      <div class="wr-sub">${esc(c.sub || "")}</div></div>`).join("")}</div>
    <div class="dots" id="wrD">${cards.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>
    <div class="two" style="margin-top:14px"><button class="btn ghost" id="wrNext">Next</button><button class="btn primary" id="wrShare">Share this card</button></div>`, { skin: skinOf(S.trip) });
  const tr = $("#wrT", sh); let idx = 0;
  tr.onscroll = () => { const i = Math.round(tr.scrollLeft / (tr.clientWidth)); if (i !== idx) { idx = i; sh.querySelectorAll("#wrD i").forEach((d, j) => d.classList.toggle("on", j === idx)); if (S.settings.sound) blip(1200, 0, .05, "sine", .05); } };
  $("#wrNext", sh).onclick = () => tr.scrollTo({ left: Math.min(cards.length - 1, idx + 1) * tr.clientWidth, behavior: "smooth" });
  $("#wrShare", sh).onclick = () => shareCard(cards[idx], sh);
  sfx("big");
}
async function shareCard(c, sh) {
  try { await document.fonts.ready; } catch {}

  const cs = getComputedStyle(sh), v = n => cs.getPropertyValue(n).trim();
  const g = x.createLinearGradient(0, 0, W * .6, H); g.addColorStop(0, v("--hero-a")); g.addColorStop(1, v("--hero-b")); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.globalAlpha = .35; x.strokeStyle = v("--accent"); x.lineWidth = 80; x.beginPath(); x.arc(W - 40, H - 40, 260, 0, Math.PI * 2); x.stroke(); x.globalAlpha = 1;
  const ink = v("--hero-ink"), muted = v("--hero-muted");
  x.fillStyle = muted; x.font = '600 34px "Instrument Sans", Arial, sans-serif'; x.fillText(c.k.toUpperCase().split("").join(String.fromCharCode(8202)), 90, 140);
  const wrap = (text, font, maxW, lh, y, color) => { x.font = font; x.fillStyle = color; const words = String(text).split(" "); let line = ""; for (const w of words) { const t2 = line ? line + " " + w : w; if (x.measureText(t2).width > maxW && line) { x.fillText(line, 90, y); y += lh; line = w; } else line = t2; } if (line) x.fillText(line, 90, y); return y + lh; };
  let y = 480;
  if (c.list) { y = 300; for (const [a, b] of c.list) { x.fillStyle = ink; x.font = '800 64px "Big Shoulders Display", Impact, sans-serif'; x.fillText(a.toUpperCase(), 90, y); x.font = '500 44px "Instrument Sans", Arial'; x.textAlign = "right"; x.fillText(b, W - 90, y); x.textAlign = "left"; y += 120; } }
  else { const size = String(c.big).length > 14 ? 130 : 170; y = wrap(String(c.big).toUpperCase(), `800 ${size}px "Big Shoulders Display", Impact, sans-serif`, W - 180, size * .92, 520, ink); }
  if (c.sub) wrap(c.sub, '500 50px "Instrument Sans", Arial, sans-serif', W - 260, 64, Math.max(y + 40, 900), ink);
  x.fillStyle = muted; x.font = '800 40px "Big Shoulders Display", Impact, sans-serif'; x.fillText((S.trip.name + " · " + APP).toUpperCase(), 90, H - 90);
  const blob = await new Promise(r => cv.toBlob(r, "image/png"));
  const file = new File([blob], "trip-wrapped.png", { type: "image/png" });
  if (navigator.canShare?.({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click(); setTimeout(() => a.remove(), 1000);
}
